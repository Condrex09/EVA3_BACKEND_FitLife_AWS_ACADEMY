# Configuración de Nginx para FitLife en AWS EC2 (Ubuntu)
# Ruta en servidor: /etc/nginx/sites-available/fitlife
# Enlace simbólico: sudo ln -s /etc/nginx/sites-available/fitlife /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # Acepta la IP pública asignada por AWS EC2

    client_max_body_size 20M;

    # Archivos estáticos recolectados con collectstatic
    location /static/ {
        alias /home/ubuntu/EVA3_BACKEND_Fitlife/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Archivos multimedia subidos por usuarios
    location /media/ {
        alias /home/ubuntu/EVA3_BACKEND_Fitlife/media/;
        expires 30d;
    }

    # Proxy inverso hacia el socket Unix de Gunicorn
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

