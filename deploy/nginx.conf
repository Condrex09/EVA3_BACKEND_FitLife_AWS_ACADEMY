# ==============================================================================
# Configuración de Nginx para FitLife en AWS EC2 (Ubuntu)
# Basado en la Receta Oficial INACAP para Django REST Framework con Gunicorn
# Ruta de instalación en servidor:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fitlife
#   sudo ln -s /etc/nginx/sites-available/fitlife /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
# ==============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Archivos estáticos recopilados (STATIC_ROOT en settings.py)
    location /static/ {
        alias /home/ubuntu/EVA3_BACKEND_Fitlife/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Archivos multimedia subidos por los socios
    location /media/ {
        alias /home/ubuntu/EVA3_BACKEND_Fitlife/media/;
        expires 30d;
    }

    # Proxy inverso hacia el socket Unix de Gunicorn (según ETAPA 6 y 8 de la receta)
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/EVA3_BACKEND_Fitlife/fitlife.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bitácoras de Nginx para auditoría de la evaluación
    error_log /var/log/nginx/fitlife_error.log;
    access_log /var/log/nginx/fitlife_access.log;
}
