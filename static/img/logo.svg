<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>
  <!-- Icono dinámico: Pesa deportiva estilizada con rayo de energía -->
  <g transform="translate(15, 12)">
    <!-- Barra -->
    <rect x="22" y="32" width="36" height="12" rx="3" fill="#FFFFFF"/>
    <!-- Discos izquierdos -->
    <rect x="4" y="16" width="10" height="44" rx="4" fill="url(#yellowGrad)"/>
    <rect x="16" y="24" width="6" height="28" rx="2" fill="#FFFFFF"/>
    <!-- Discos derechos -->
    <rect x="66" y="16" width="10" height="44" rx="4" fill="url(#yellowGrad)"/>
    <rect x="58" y="24" width="6" height="28" rx="2" fill="#FFFFFF"/>
    <!-- Rayo de pulso -->
    <path d="M 40 10 L 28 38 L 38 38 L 32 66 L 52 32 L 42 32 Z" fill="#FFC400" stroke="#111111" stroke-width="2"/>
  </g>
  <!-- Texto FitLife -->
  <text x="110" y="65" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">
    FIT<tspan fill="#FFC400">LIFE</tspan>
  </text>
  <!-- Subtítulo Centro Deportivo -->
  <text x="115" y="85" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#AAAAAA" letter-spacing="4">
    CENTRO DEPORTIVO
  </text>
</svg>

